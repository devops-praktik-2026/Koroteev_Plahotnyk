name: Задача
description: Новая карточка для доски. Описывается от лица того, кому это нужно.
title: "[Задача]: "
labels: ["задача"]
body:
  - type: markdown
    attributes:
      value: |
        Карточка описывает не «что сделать в коде», а **зачем это нужно**.
        Так проще проверить, что задача закрыта: работает ли то, ради чего её брали.

  - type: textarea
    id: story
    attributes:
      label: Кому и зачем
      description: Одно предложение по образцу.
      placeholder: |
        Как менеджер, я хочу создать заказ для существующего клиента,
        чтобы клиент получил подтверждение покупки.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Условия приёмки
      description: |
        По каждому пункту должно быть понятно, выполнен он или нет.
        Формат: «Если — Когда — То».
      placeholder: |
        - Если клиент с номером 1 существует,
          когда приходит запрос на создание заказа,
          то в ответ приходит код 201 и карточка заказа с номером.

        - Если клиента с таким номером нет,
          когда приходит запрос на создание заказа,
          то в ответ приходит код 404 и понятное сообщение.
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Этап
      options:
        - "Этап 0 — подготовка"
        - "Этап 1 — договорённость и проверки"
        - "Этап 2 — контейнеры и окружение"
        - "Этап 3 — сервер"
        - "Этап 4 — установка версий"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Что может помешать
      description: Необязательно. Чего не хватает, от чего зависит, что непонятно.
