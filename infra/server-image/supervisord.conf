# Что запущено на учебном «сервере».
#
# Надзиратель (supervisor) — это то, что на настоящей машине делает systemd:
# держит службы запущенными, перезапускает упавшие, собирает их вывод.
# Здесь он взят потому, что внутри контейнера systemd не работает.
#
# Сейчас под присмотром только ssh. Описание вашей службы приложения
# положит сюда сценарий настройки на занятии 6 — отдельным файлом
# в тот же каталог /etc/supervisor/conf.d/
#
# Полезные команды на сервере:
#     supervisorctl status          что запущено
#     supervisorctl restart orders  перезапустить службу
#     supervisorctl tail -f orders  смотреть вывод службы

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
