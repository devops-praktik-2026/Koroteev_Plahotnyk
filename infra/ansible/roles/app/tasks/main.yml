
# Что здесь должно появиться:
#   - окружение Python в каталоге приложения
#   - файл настроек из шаблона: адрес базы данных, адрес соседнего сервиса
#   - описание службы для надзирателя в /etc/supervisor/conf.d/
#   - перезапуск службы через обработчик, а не напрямую
#
# Проверка: после запуска сценария приложение отвечает на служебный запрос
#     curl http://localhost:8101/health
#
# Полезное на сервере:
#     supervisorctl status          что запущено
#     supervisorctl restart orders  перезапустить службу
#     supervisorctl tail -f orders  смотреть вывод
#
# Подсказка:
#   ansible.builtin.pip        установка пакета в окружение
#   ansible.builtin.template   файл настроек из шаблона
#   ansible.builtin.copy       описание службы
#   notify + handlers          перезапуск только когда что-то изменилось

- name: Заглушка, чтобы сценарий запускался до того, как вы его напишете
  ansible.builtin.debug:
    msg: "Роль app пока пустая."
