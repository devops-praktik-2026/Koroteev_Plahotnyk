
# Что здесь должно появиться:
#   - обновление списка пакетов
#   - системные зависимости, которые нужны приложению
#   - каталоги под приложение с правильным владельцем
#   - ключи доступа второго участника пары
#
# Каждый шаг пишется так, чтобы повторный запуск ничего не менял.
# Не «выполни команду mkdir», а «каталог должен существовать»: первая
# формулировка ломается при повторе, вторая — нет.
#
# Подсказка для первых шагов:
#   ansible.builtin.apt      пакеты
#   ansible.builtin.file     каталоги и права
#   ansible.builtin.user     пользователи
#   ansible.posix.authorized_key   ключи доступа

- name: Заглушка, чтобы сценарий запускался до того, как вы его напишете
  ansible.builtin.debug:
    msg: "Роль base пока пустая."
