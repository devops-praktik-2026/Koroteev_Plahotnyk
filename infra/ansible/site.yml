# Сценарий настройки серверов.
#
# Запуск:
#     ansible-playbook -i inventory.ini site.yml
#
# Проверить связь до того, как что-то настраивать:
#     ansible -i inventory.ini app -m ping
#
# Главное свойство хорошего сценария: его можно запустить второй раз,
# и он ничего не изменит, потому что всё уже сделано. Проверяется просто —
# во второй раз в итоговой строке должно быть changed=0.

- name: Настроить сервер под приложение
  hosts: app
  become: true

  roles:
    - base   # пользователи, ключи доступа, системные зависимости
    - app    # каталог приложения, окружение, настройки, служба

  # ЗАДАНИЕ: наполните роли задачами. Начните с base/tasks/main.yml.
  #
  # Проверить себя: удалите стенд (tofu destroy), создайте заново (tofu apply)
  # и запустите сценарий на чистых машинах. Если он отработал без ошибок —
  # роли написаны правильно. Если пришлось что-то доделать руками, значит,
  # это «что-то» нужно дописать в сценарий, а не оставлять в голове.
