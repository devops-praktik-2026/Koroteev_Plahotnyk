# Образец списка серверов. Скопируйте в inventory.ini:
#     cp inventory.example.ini inventory.ini
#
# Порты и адреса соответствуют стенду, который создаёт описание из
# ../terraform. Проверить, что получилось, можно командой:
#     cd ../terraform && tofu output servers
#
# Настоящий inventory.ini в репозиторий не кладут — он у каждого свой.

[app]
server-1 ansible_host=127.0.0.1 ansible_port=2201
server-2 ansible_host=127.0.0.1 ansible_port=2202

[app:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null'
